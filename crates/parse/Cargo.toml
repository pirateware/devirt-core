[package]
name = "parse"
version = "0.1.0"
edition = "2024"

[dependencies]
ir            = { path = "../ir" }
oxc_allocator = "0.40"
oxc_ast       = "0.40"
oxc_parser    = "0.40"
oxc_span      = "0.40"

[dev-dependencies]
emit          = { path = "../emit" }
insta         = "1"
proptest      = "1"

[features]
# Behavior-preservation tests that shell out to `node`. Enabled by the
# workspace umbrella feature `mvp/node-tests`. Off by default so plain
# `cargo test` runs without a Node runtime installed.
node-tests = []
