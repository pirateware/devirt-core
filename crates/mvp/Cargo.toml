[package]
name = "mvp"
version = "0.1.0"
edition = "2024"

[dependencies]
oxc_allocator = "0.40"
oxc_ast       = "0.40"
oxc_codegen   = "0.40"
oxc_parser    = "0.40"
oxc_span      = "0.40"
bitflags      = "2"
lasso         = "0.7"
ir            = { path = "../ir" }
emit          = { path = "../emit" }

[dev-dependencies]
insta         = "1"

[features]
# Behavior-preservation tests shell out to `node`. Enabled with
# `cargo test --features node-tests`. Off by default so CI can run without
# a Node runtime installed.
node-tests = []
