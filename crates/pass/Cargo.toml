[package]
name = "pass"
version = "0.1.0"
edition = "2024"

[features]
# Symbolic-execution + Z3 SMT backend (issue #50). Off by default.
#
# System requirement: libz3 (Ubuntu/Debian: `sudo apt install libz3-dev`,
# macOS: `brew install z3`). Without the system library the crate will
# fail to link when this feature is enabled. Default `cargo test
# --workspace` does not require libz3.
smt = ["dep:z3"]

[dependencies]
ir            = { path = "../ir" }
z3            = { version = "0.20", optional = true }
