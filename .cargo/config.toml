[target.wasm32-unknown-unknown]
rustflags = [
    # getrandom 0.3 (pulled in via boa_engine -> rand) refuses to build for wasm
    # unless told which backend to use. The JS backend is correct for browser /
    # Cloudflare Workers (V8) hosts.
    '--cfg', 'getrandom_backend="wasm_js"',
    # There are no threads on wasm, so the deobfuscate/harness workers run inline
    # against the module's linear-memory stack (default ~1 MiB). Boa's recursive
    # parser/VM and oxc's traversal need far more, so raise it to 16 MiB. A stack
    # overflow traps the instance, so this is the depth ceiling — tune up if deeply
    # nested input traps, down to reclaim heap (Workers cap total memory at 128 MiB).
    '-C', 'link-arg=-zstack-size=16777216',
]
