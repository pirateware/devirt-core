name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings = errors)
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Build
        run: cargo build --release

      # The full suite gates every change. Beyond the per-pass units it includes
      # the differential snippet-equivalence harness, the robustness /
      # panic-containment battery, and the regression net: byte-exact golden
      # snapshots of every sample (`tests/golden.rs`) plus whole-pipeline
      # behavior-equivalence on the real corpus (`tests/sample_equivalence.rs`).
      # A snapshot mismatch fails here with a re-bless hint; see tests/README.md.
      - name: Test
        run: cargo test --release
