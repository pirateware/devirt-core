[package]
name = "devirt-core"
version = "0.2.4"
edition = "2021"

[[bin]]
name = "deob"
path = "src/main.rs"

[[bin]]
name = "report"
path = "src/bin/report.rs"

[dependencies]
oxc_allocator = "0.134.0"
oxc_parser    = "0.134.0"
oxc_ast       = "0.134.0"
oxc_semantic  = "0.134.0"
oxc_traverse  = "0.134.0"
oxc_codegen   = "0.134.0"
oxc_span      = "0.134.0"
oxc_syntax    = "0.134.0"
oxc_ecmascript = "0.134.0"
boa_engine = "0.21.1"
oxc_ast_visit = "0.134.0"
rayon = "1"

[profile.release]
opt-level = 3
