[package]
name = "js-deobfuscator"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "deob"
path = "src/main.rs"

[dependencies]
oxc_allocator = "0.134.0"
oxc_parser    = "0.134.0"
oxc_ast       = "0.134.0"
oxc_semantic  = "0.134.0"
oxc_traverse  = "0.134.0"
oxc_codegen   = "0.134.0"
oxc_span      = "0.134.0"
oxc_syntax    = "0.134.0"
oxc_ecmascript = "0.134.0"
rquickjs = "0.12.0"
oxc_ast_visit = "0.134.0"
# `deob --json` serializes the Report (correct escaping of arbitrary JS in the
# `code` field); also parses the generated-corpus manifest in tests.
serde_json = "1"

[workspace]
members = ["server"]

[profile.release]
opt-level = 3
